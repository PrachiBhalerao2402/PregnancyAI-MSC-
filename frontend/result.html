<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Risk Result</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page result-page">
      <span class="bg-circle left"></span>
      <span class="bg-circle right"></span>

      <section class="card result-card" id="resultCard">
        <div class="status-icon" id="statusIcon">✓</div>
        <h2 id="riskHeading">Low Risk</h2>
        <div class="risk-strip" id="riskStrip">Low Risk</div>

        <h3>Why this result?</h3>
        <ul id="reasonList">
          <li>All vitals are within normal range</li>
          <li>Healthy BMI and age group — low complication risk</li>
          <li>No pre-existing conditions detected</li>
        </ul>

        <div class="advice-box" id="adviceBox">
          <strong>💡 Health Advice</strong>
          <p id="adviceText">Great news! Your vitals look healthy. Continue your balanced diet and regular check-ups.</p>
        </div>

        <button class="btn-primary">💡 Get Advice</button>
        <a href="index.html" class="btn-secondary link-btn">← Return Home</a>
      </section>
    </main>

    <script src="result.js"></script>
  </body>
</html>
